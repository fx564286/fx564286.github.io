<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1018" />
  <meta name="description" content="게임 프로젝트 5번 섹션 UI/UX 인터랙티브 프로토타입" />
  <title>경계의 기록 | UI/UX 프로토타입</title>
<style>
:root {
  color-scheme: dark;
  --bg: #090e15;
  --surface: #111a25;
  --surface-hi: #172332;
  --surface-muted: #0d1722;
  --line: #2a3949;
  --line-soft: #1d2b3a;
  --text: #edf2f4;
  --text-muted: #9caab7;
  --text-faint: #6f8292;
  --gold: #d9bc83;
  --gold-bright: #f0d398;
  --cyan: #8bd4d8;
  --green: #96d3b0;
  --warning: #e4a781;
  --danger: #e7928f;
  --radius: 16px;
  font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; color: var(--text); background: var(--bg); }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .57; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 4px; }
.svg-symbols, .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
.skip-link { position: fixed; z-index: 1000; left: 16px; top: -70px; opacity: 0; padding: 10px 14px; background: var(--gold); color: #10151b; }
body.keyboard-navigation .skip-link:focus-visible { top: 16px; opacity: 1; }
.icon { width: 19px; height: 19px; flex: none; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.app-shell { min-height: 100dvh; display: grid; grid-template-columns: 234px minmax(0,1fr); background: radial-gradient(ellipse at 45% -40%, #1c3040 0, transparent 62%), var(--bg); }
.sidebar { position: sticky; top: 0; height: 100dvh; min-height: 680px; border-right: 1px solid #263340; background: rgba(10,17,25,.92); display: flex; flex-direction: column; padding: 35px 17px 24px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 39px; }
.brand-mark { width: 40px; height: 44px; border: 1px solid #ac9268; color: var(--gold); display: grid; place-items: center; font-size: 24px; clip-path: polygon(50% 0,100% 21%,100% 78%,50% 100%,0 78%,0 21%); background: #1f2529; }
.brand-mark b { font-family: Georgia,serif; font-weight: 500; }
.brand-text strong { display: block; font-size: 17px; letter-spacing: -.055em; font-weight: 750; }
.brand-text small { display: block; color: var(--gold); font-family: Georgia,serif; font-size: 9px; letter-spacing: .23em; margin-top: 3px; }
.nav-caption { padding: 0 14px; margin: 0 0 13px; font-size: 10px; font-weight: 700; color: var(--text-faint); letter-spacing: .2em; }
.main-nav { display: grid; gap: 6px; }
.nav-button { width: 100%; border: 1px solid transparent; background: transparent; color: #9aa9b9; border-radius: 9px; min-height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 14px; text-align: left; font-size: 13px; font-weight: 650; }
.nav-button:hover { background: #162331; color: var(--text); }
.nav-button.active { color: var(--gold-bright); background: #272922; border-color: #494436; }
.nav-button.active::after { content: ''; width: 4px; height: 4px; border-radius: 50%; margin-left: auto; background: var(--gold); }
.sidebar-bottom { margin-top: auto; border-top: 1px solid var(--line-soft); padding-top: 20px; }
.side-status { border: 1px solid #2b3d49; border-radius: 12px; background: linear-gradient(125deg,#1a2833,#121a22); padding: 16px; margin-bottom: 13px; }
.side-status .tiny { color: var(--text-muted); font-size: 10px; letter-spacing: .07em; }
.side-status strong { display: block; font-size: 25px; font-family: Georgia,serif; font-weight: 400; letter-spacing: -.02em; margin-top: 6px; }
.side-status strong em { font-style: normal; font-family: inherit; font-size: 11px; color: var(--text-faint); }
.side-progress { background: #273541; height: 4px; margin-top: 13px; border-radius: 5px; overflow: hidden; }
.side-progress span { display: block; height: 100%; background: var(--gold); transition: width .35s; }
.settings-link { width: 100%; padding: 11px 12px; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; color: var(--text-muted); text-align: left; font-size: 12px; }
.settings-link:hover { color: white; }
.sidebar-note { color: #62798a; font-size: 9px; letter-spacing: .07em; padding: 11px 12px 0; }
.main-content { min-width: 0; max-width: 1600px; width: 100%; margin: auto; padding: 30px clamp(22px,4.3vw,73px) 80px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 31px; }
.breadcrumb { display: flex; align-items: center; gap: 9px; color: #8596a5; font-size: 12px; }
.breadcrumb span:last-child { color: #d5dde1; }
.breadcrumb .icon { width: 13px; height: 13px; }
.top-actions { display: flex; align-items: center; gap: 13px; }
.world-pill { padding: 9px 14px; border: 1px solid #2d4045; border-radius: 999px; color: #acbbb9; background: #101e24; font-size: 11px; white-space: nowrap; }
.world-pill i { display: inline-block; background: #89c8b3; border-radius: 50%; width: 5px; height: 5px; margin-right: 7px; vertical-align: 2px; }
.avatar { background: #2d3434; border: 1px solid #727059; color: var(--gold-bright); border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; font-family: Georgia,serif; font-size: 17px; }
.page-header { margin-bottom: 29px; }
.eyebrow { text-transform: uppercase; color: var(--gold); font: 600 10px/1.4 Georgia,serif; letter-spacing: .26em; }
h1,h2,h3,h4,p { margin-top: 0; }
h1 { margin-bottom: 9px; font-size: clamp(27px,3.5vw,41px); line-height: 1.3; letter-spacing: -.06em; font-weight: 750; }
h2 { font-size: 19px; letter-spacing: -.045em; margin: 0; }
h3 { font-size: 15px; letter-spacing: -.03em; margin: 0; }
.page-desc { font-size: 13px; color: var(--text-muted); line-height: 1.7; margin: 0; }
.hero { position: relative; overflow: hidden; border: 1px solid #43515b; border-radius: 16px; min-height: 305px; display: flex; align-items: center; padding: 41px clamp(26px,5.4vw,68px); isolation: isolate; background: linear-gradient(100deg,rgba(6,13,22,.96) 4%,rgba(9,19,30,.84) 45%,rgba(12,22,32,.3) 100%), linear-gradient(160deg,#1e3646,#394e4a 43%,#101d29 80%); }
.hero::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at 77% 29%,rgba(219,191,130,.48),transparent 14%), radial-gradient(ellipse at 76% 43%,rgba(81,127,132,.25),transparent 30%), linear-gradient(155deg,transparent 56%,#09131c 56.2% 64%,transparent 64.2%), linear-gradient(165deg,transparent 48%,#162f3b 48.2% 60%,transparent 60.2%),linear-gradient(195deg,transparent 65%,#0e1f2c 65.2% 75%,transparent 75.2%); opacity:.93; }
.hero::after { content: ''; position:absolute; right:5%; bottom:-120px; width:365px; height:330px; border:1px solid rgba(215,188,132,.22); border-radius:50%; box-shadow: 0 0 0 55px rgba(223,199,149,.035),0 0 0 108px rgba(223,199,149,.018); z-index:-1; }
.hero-content { max-width: 540px; }
.hero .eyebrow { font-size: 11px; margin-bottom: 14px; }
.hero h2 { font-size: clamp(25px,3vw,37px); line-height: 1.38; font-weight: 740; margin-bottom: 15px; }
.hero p { color: #aebdc5; line-height: 1.8; font-size: 13px; max-width: 420px; margin-bottom: 24px; }
.hero-footer { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.primary-button, .secondary-button, .ghost-button, .small-button { border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 9px; border-radius: 9px; transition: background .18s,border-color .18s,transform .18s; font-weight: 700; }
.primary-button { min-height: 44px; background: var(--gold); color: #18212a; padding: 0 20px; font-size: 12px; border-color: var(--gold); }
.primary-button:hover:not(:disabled) { background: #f0d7a2; transform: translateY(-1px); }
.secondary-button { min-height: 43px; background: #20303e; border-color: #405462; color: #e5ebec; padding: 0 18px; font-size: 12px; }
.secondary-button:hover:not(:disabled) { background: #2d4353; }
.ghost-button { background: transparent; color: var(--gold); border-color: #716248; padding: 0 16px; min-height: 40px; font-size: 11px; }
.ghost-button:hover:not(:disabled) { background: rgba(218,188,132,.08); }
.small-button { font-size: 11px; border: 1px solid #425464; background:#1c2b39; color:#dbe3e9; padding: 8px 12px; min-height: 33px; }
.small-button:hover:not(:disabled) { background:#2b4051; }
.text-button { padding: 7px 0; color: var(--gold); background: none; border:0; display: inline-flex; gap: 7px; align-items: center; font-size: 12px; font-weight: 650; }
.text-button:hover { color: var(--gold-bright); }
.section-row { display: flex; align-items:center; justify-content: space-between; gap: 20px; margin: 31px 0 18px; }
.section-row p { margin: 5px 0 0; color:var(--text-faint); font-size: 11px; }
.summary-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 13px; margin-top: 16px; }
.summary-tile { border:1px solid var(--line); background: linear-gradient(145deg,#192633,#131c28); padding: 21px 23px; border-radius: 12px; min-height: 120px; }
.summary-tile small { color:var(--text-muted); font-size:11px; display:flex; gap:8px; align-items:center; }
.summary-tile .icon { color: var(--gold); width: 16px; height: 16px; }
.summary-tile strong { display:block; margin-top: 15px; font: 400 31px/1 Georgia,serif; }
.summary-tile strong span { color:var(--text-muted); font: 500 12px/1.2 system-ui,sans-serif; margin-left:8px; }
.home-bottom { display: grid; grid-template-columns: 1.35fr .85fr; gap: 17px; }
.panel { background: linear-gradient(145deg,#16212d,#111b26); border:1px solid var(--line); border-radius: var(--radius); padding: 22px; min-width: 0; }
.panel-head { display:flex; justify-content:space-between; align-items:start; gap:14px; margin-bottom: 22px; }
.panel-head small { display:block; font-size:11px; color:var(--text-muted); margin-top: 7px; }
.progress-track { margin: 12px 0 8px; height: 7px; background: #283746; border-radius:10px; overflow:hidden; }
.progress-track span { display:block; height:100%; background: linear-gradient(90deg,#9b9e77,var(--gold)); border-radius:10px; }
.checkpoint { display:flex; justify-content:space-between; color:var(--text-muted); font-size:11px; margin-top: 12px; }
.zone-line { display:flex; align-items:center; gap:13px; border-bottom:1px solid var(--line-soft); padding: 15px 0; }
.zone-line:last-child { border:0; padding-bottom:0; }
.zone-line .zone-dot { height:36px; width:36px; border:1px solid #3d5660; background:#273d46; color:var(--gold); display:grid; place-items:center; border-radius:9px; font:500 14px Georgia,serif; }
.zone-line strong { font-size:12px; display:block; }
.zone-line small { font-size:10px; color:var(--text-muted); display:block; margin-top: 5px; }
.zone-line .line-state { margin-left:auto; font-size:10px; color:var(--gold); }
.tag { border: 1px solid #444f52; border-radius:4px; font-size:10px; padding:4px 6px; color:#b6c6c5; white-space:nowrap; }
.tag.gold { background:rgba(216,183,115,.08); color:var(--gold); border-color:#685b3f; }
.tag.green { color:#9fdbb8; border-color:#345f4f; background:#19342b; }
.tag.red { color:#e6a7a0; border-color:#704840; background:#312326; }
.tag.gray { color:#9cabb7; }
.stage-grid { display:grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap:16px; }
.stage-card { min-width:0; padding:0; overflow:hidden; text-align:left; background: #121e2a; border:1px solid #31404e; border-radius:14px; color:var(--text); display:flex; flex-direction:column; transition: border-color .2s, transform .2s; }
.stage-card:hover { border-color:#b79c68; transform:translateY(-2px); }
.stage-card.selected { border-color:var(--gold); box-shadow: inset 0 0 0 1px rgba(216,187,131,.15),0 0 0 1px rgba(216,187,131,.12); }
.stage-card.locked .stage-art { filter:saturate(.5) brightness(.65); }
.stage-art { min-height:142px; position:relative; overflow:hidden; display:flex; align-items:start; justify-content:space-between; padding:13px; isolation:isolate; background:#223f46; }
.stage-art::before { content:''; position:absolute; inset:0; z-index:-2; background: radial-gradient(ellipse at 75% 28%,rgba(233,218,169,.66) 0%,transparent 16%),linear-gradient(160deg,transparent 48%,rgba(5,13,23,.36) 48.5% 60%,transparent 60.3%),linear-gradient(155deg,transparent 35%,rgba(5,13,23,.66) 36% 57%,transparent 57.3%); }
.stage-art::after { content:''; position:absolute; z-index:-1; width:105%; height:110px; transform:rotate(-15deg); right:-34%; bottom:-75px; border:1px solid rgba(230,217,182,.38); border-radius:50%; box-shadow:0 0 0 23px rgba(230,217,182,.04),0 0 0 48px rgba(230,217,182,.027); }
.art-cracks { background:linear-gradient(145deg,#45616a,#152c3b 62%,#17252d); }
.art-bog { background:linear-gradient(135deg,#465d50,#182f32 70%,#13272e); }
.art-forge { background:linear-gradient(135deg,#8a5541,#4b302d 65%,#1b2833); }
.art-ruins { background:linear-gradient(135deg,#5b556b,#282c44 63%,#202431); }
.art-stars { background:linear-gradient(135deg,#3e5c7b,#223551 65%,#101e32); }
.art-abyss { background:linear-gradient(135deg,#544764,#29243d 65%,#161825); }
.art-no { background:rgba(8,15,24,.5); border:1px solid rgba(216,223,223,.2); padding:5px 8px; font:11px Georgia,serif; letter-spacing:.08em; }
.art-state { background:rgba(10,15,22,.62); border:1px solid rgba(225,222,208,.18); border-radius:4px; padding:4px 7px; font-size:10px; }
.stage-copy { padding:18px; flex:1; }
.stage-copy .stage-zone { color:var(--gold); font-size:10px; margin-bottom:7px; letter-spacing:.06em; }
.stage-copy h3 { font-size:16px; margin-bottom:7px; }
.stage-copy .stage-sub { color:var(--text-muted); font-size:11px; line-height:1.5; min-height:32px; }
.stage-meta { border-top:1px solid var(--line-soft); display:flex; justify-content:space-between; gap:6px; padding-top:12px; margin-top:14px; color:var(--text-muted); font-size:10px; }
.stage-meta strong { color:#d1dddf; }
.details-layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(270px,.85fr); gap:17px; margin-top:18px; }
.detail-feature { display:flex; align-items:center; gap:11px; border:1px solid #3b4b59; background:#1a2b36; border-radius:10px; padding:13px 16px; margin:17px 0; color:#b7c5cd; font-size:12px; }
.detail-feature .icon { color:var(--gold); }
.detail-line { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line-soft); font-size:12px; }
.detail-line:last-child { border-bottom:0; }
.detail-line span:first-child { color:var(--text-muted); }
.detail-line strong { font-size:12px; font-weight:650; }
.resource-label { display:flex; align-items:center; gap:9px; }
.resource-emblem { height:29px; width:29px; border:1px solid #5c675d; border-radius:7px; background:#293b3b; color:var(--gold); display:inline-grid; place-items:center; font-size:17px; }
.resource-emblem.green { color:var(--green); border-color:#486b54; background:#24382f; }
.resource-emblem.orange { color:#efb380; border-color:#79583f; background:#3c2d2a; }
.resource-emblem.cyan { color:#8fdbe2; border-color:#47727a; background:#243c43; }
.resource-emblem.violet { color:#bfb1fa; border-color:#605479; background:#302b42; }
.resource-emblem.blue { color:#99c3f3; border-color:#46637a; background:#263649; }
.resource-emblem.gold { color:#f6d592; border-color:#6b603d; background:#3c3528; }
.full { width:100%; }
.warning-box { font-size:11px; line-height:1.65; border-left:2px solid #a28b5e; background:#272b2a; padding:10px 13px; margin:14px 0; color:#d7caaa; }
.recipe-layout { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(300px,.85fr); gap:18px; align-items:start; }
.recipe-list { display:grid; gap:10px; }
.recipe-button { border:1px solid #2d4050; border-radius:12px; display:flex; align-items:center; text-align:left; color:var(--text); background:#15212d; padding:16px; gap:15px; }
.recipe-button:hover { border-color:#9e8761; }
.recipe-button.active { background:#242b2d; border-color:var(--gold); }
.item-symbol { min-width:55px; height:58px; border:1px solid #5b5e53; background: radial-gradient(circle at 50% 20%,#454b44,#20282a); color:var(--gold); display:grid; place-items:center; border-radius:10px; font:27px Georgia,serif; }
.item-symbol .icon { width:28px; height:28px; }
.recipe-button .recipe-text { flex:1; min-width:0; }
.recipe-button strong { font-size:13px; display:block; margin-bottom:6px; }
.recipe-button small { display:block; font-size:11px; color:var(--text-muted); }
.recipe-button .icon { color:var(--text-muted); }
.recipe-button .tag { align-self:start; }
.sticky-panel { position:sticky; top:22px; }
.item-showcase { height:180px; border:1px solid #42515c; border-radius:12px; background: radial-gradient(ellipse at 50% 40%,#3b4d4a,transparent 50%), radial-gradient(ellipse at 50% 105%,#293840,transparent 55%), #16232d; display:grid; place-items:center; margin-bottom:22px; position:relative; }
.item-showcase::before,.item-showcase::after { content:''; position:absolute; width:136px; height:136px; border:1px solid #58615a; border-radius:50%; opacity:.5; }
.item-showcase::after { width:100px; height:100px; transform:rotate(45deg); border-radius:7px; }
.item-showcase .icon { width:65px; height:65px; color:var(--gold-bright); z-index:1; }
.showcase-rune { z-index:1; font-size:63px; color:var(--gold-bright); font-family:Georgia,serif; }
.material-row { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line-soft); padding:11px 0; gap:10px; }
.material-row:last-child { border:0; }
.material-name { display:flex; align-items:center; gap:9px; font-size:12px; }
.material-qty { font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.material-qty.missing { color:var(--danger); }
.material-qty.enough { color:var(--green); }
.bag-layout { display:grid; grid-template-columns:1fr 1fr; gap:17px; }
.equipment-slots { display:grid; gap:10px; }
.equipment-slot { display:flex; align-items:center; gap:13px; border:1px solid #304253; border-radius:10px; background:#172635; padding:14px; min-height:80px; }
.equipment-slot strong { display:block; font-size:12px; margin-top:4px; }
.equipment-slot small { font-size:10px; color:var(--text-muted); }
.equipment-slot b { margin-left:auto; font-size:12px; color:var(--gold); }
.inventory-card { display:flex; gap:11px; align-items:center; border-bottom:1px solid var(--line-soft); padding:13px 0; }
.inventory-card:last-child { border:0; }
.inventory-card .item-symbol { min-width:42px; width:42px; height:42px; }
.inventory-card .item-symbol .icon { width:20px; height:20px; }
.inventory-card strong { display:block; font-size:12px; }
.inventory-card small { color:var(--text-muted); font-size:10px; }
.inventory-card .small-button { margin-left:auto; }
.bag-materials { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.bag-material { display:flex; align-items:center; gap:10px; padding:10px; background:#192835; border:1px solid #304351; border-radius:9px; }
.bag-material strong { margin-left:auto; font-size:12px; }
.bag-material span:not(.resource-emblem) { font-size:10px; }
.battle-shell { min-height:calc(100dvh - 140px); display:flex; flex-direction:column; }
.battle-view { position:relative; overflow:hidden; border-radius:17px; border:1px solid #455160; flex:1; min-height:440px; background: radial-gradient(ellipse at 52% 65%,rgba(122,103,82,.3),transparent 44%),linear-gradient(180deg,#263c4a,#101a27 72%); padding:23px; isolation:isolate; }
.battle-view::before { content:''; position:absolute; inset:0; z-index:-1; background:radial-gradient(ellipse at 52% 18%,rgba(222,195,147,.23),transparent 20%),linear-gradient(155deg,transparent 45%,#192c36 46% 59%,transparent 60%),linear-gradient(205deg,transparent 49%,#152632 50% 63%,transparent 64%); }
.battle-view::after { content:''; position:absolute; bottom:-110px; left:-15%; width:130%; height:210px; border-radius:50%; background:#111923; box-shadow:0 -30px 40px rgba(20,21,24,.6); z-index:-1; }
.battle-top { display:flex; justify-content:space-between; align-items:start; gap:20px; }
.battle-top strong { font-size:13px; display:block; }
.battle-top small { font-size:10px; color:var(--gold); display:block; margin-top:5px; }
.enemy-target { margin:auto; width:min(90%,450px); text-align:center; position:relative; padding-top:30px; }
.enemy-avatar { width:170px; height:194px; margin:25px auto 12px; position:relative; display:grid; place-items:center; color:var(--gold); filter:drop-shadow(0 7px 24px #05080b); }
.enemy-avatar::before { content:''; position:absolute; background:linear-gradient(150deg,#4d5359,#191f2b); width:95px; height:138px; border:1px solid #747362; border-radius:43% 43% 23% 23%; clip-path:polygon(20% 10%,50% 0,80% 10%,95% 83%,63% 100%,37% 100%,5% 83%); }

function initialState() {
  return {
    player: { displayName: '개척자', level: 12, basePower: 150, maxHp: 120 },
    wallet: { scrap: 5, fissureIron: 8, bogSap: 0, emberCrystal: 0, memoryShard: 0, nebulaAlloy: 0, abyssCore: 0 },

    session: { id: 'mock-session', mode: 'fixture' },
  };

function totalPower(state) {
  const gearPower = Object.values(state.equipment).reduce((total, instanceId) => {
    const item = state.inventory.find((i) => i.instanceId === instanceId);
    return total + (item?.power ?? 0);
  }, 0);
  return state.player.basePower + gearPower;
}
function stageAccess(stage, state) {
  const unlocked = stage.index === 1 || state.clearedStageIds.includes(`S${String(stage.index - 1).padStart(2, '0')}`);
  const sufficientPower = totalPower(state) >= stage.recommendedPower;
  return {
    unlocked,
    sufficientPower,
    canEnter: unlocked && sufficientPower,
    reason: !unlocked ? `이전 구역 ${String(stage.index - 1).padStart(2, '0')}을 먼저 완료해야 합니다.` : !sufficientPower ? `권장 전투력 ${stage.recommendedPower} 이상이 필요합니다.` : null,
  };
}
function craftingStatus(recipe, wallet) {
  const missing = Object.entries(recipe.cost).filter(([id, amount]) => (wallet[id] ?? 0) < amount)
    .map(([id, amount]) => ({ id, required: amount, owned: wallet[id] ?? 0, deficit: amount - (wallet[id] ?? 0) }));
  return { craftable: missing.length === 0, missing };
}
function craft(state, recipeId) {
  const recipe = recipes.find((r) => r.id === recipeId);
  if (!recipe) return { ok: false, code: 'UNKNOWN_RECIPE', state };
  if (!craftingStatus(recipe, state.wallet).craftable) return { ok: false, code: 'INSUFFICIENT_RESOURCES', state };
  const next = structuredClone(state);
  for (const [id, amount] of Object.entries(recipe.cost)) next.wallet[id] -= amount;
  const currentMax = next.inventory.reduce((max, item) => Math.max(max, Number(item.instanceId.slice(1)) || 0), 0);
  const item = { instanceId: `E${String(currentMax + 1).padStart(3, '0')}`, recipeId: recipe.id, name: recipe.name, kind: recipe.kind, rarity: recipe.rarity, power: recipe.power };
  next.inventory.push(item);
  return { ok: true, item, state: next };
}
function equip(state, instanceId) {
  const item = state.inventory.find((i) => i.instanceId === instanceId);
  if (!item || !Object.hasOwn(state.equipment, item.kind)) return { ok: false, code: 'INVALID_ITEM', state };
  const next = structuredClone(state);
  next.equipment[item.kind] = instanceId;
  return { ok: true, state: next };
}
function completeStage(state, stageId, rewardQuantity) {
  const stage = stages.find((s) => s.id === stageId);
  if (!stage || !Number.isInteger(rewardQuantity) || rewardQuantity < stage.rewardMin || rewardQuantity > stage.rewardMax) {
    return { ok: false, code: 'INVALID_REWARD', state };
  }
  if (!stageAccess(stage, state).canEnter) return { ok: false, code: 'STAGE_NOT_ACCESSIBLE', state };
  const next = structuredClone(state);
  next.wallet[stage.exclusiveResourceId] += rewardQuantity;
  next.wallet.scrap += 2;
  if (!next.clearedStageIds.includes(stage.id)) next.clearedStageIds.push(stage.id);
  return { ok: true, state: next, reward: { [stage.exclusiveResourceId]: rewardQuantity, scrap: 2 } };
}

// Unique-source invariant: each stage exposes exactly one zone-exclusive item.
function validateFixtures() {
  const stageIds = new Set(stages.map((s) => s.id));
  const ids = stages.map((s) => s.exclusiveResourceId);
  return {
    uniqueStageIds: stageIds.size === stages.length,
    uniqueExclusiveResources: new Set(ids).size === ids.length,
    resourcesExist: ids.every((id) => Object.hasOwn(resources, id)),
    recipesUseKnownResources: recipes.every((r) => Object.keys(r.cost).every((id) => Object.hasOwn(resources, id))),
    recipesUseStageResources: recipes.every((r) => Object.keys(r.cost).some((id) => ids.includes(id))),

  if (!isSnapshot(initialSnapshot) || !isRevision(initialRevision)) throw new TypeError('invalid initial snapshot/revision');
  let snapshot = clone(initialSnapshot);
  let revision = initialRevision;
  let active = null;
  let error = null;
  let reconciliationRequired = false;
  let sequence = 0;
  const requestId = nextRequestId ?? (() => `UI5-${++sequence}`);

    pending: active ? { type: active.type, requestId: active.requestId } : null,
    error: error ? { ...error } : null, reconciliationRequired });
  const publish = () => onChange(clone(snapshot), status());
  const fail = (code, details = {}, requiresSync = false) => {
    active = null;
    reconciliationRequired ||= requiresSync;
    error = { code, ...details };
    publish();
    return { ok: false, code };
  };
  // Abort is a client-side timeout, NOT evidence that the server rolled back.
  const timed = async (operation) => {
    const controller = new AbortController();
    let timer;
    let expired = false;
    try {
      return await Promise.race([
        Promise.resolve().then(() => operation(controller.signal)),
        new Promise((_, reject) => { timer = setTimeout(() => {
          expired = true;
          controller.abort();
          reject(Object.assign(new Error('UI request deadline exceeded'), { code: 'TIMEOUT' }));
        }, timeoutMs); }),
      ]);
    } catch (err) {
      // Aborting may reject the transport before the timeout rejection wins the race.

      throw err;

    if (active) return { ok: false, code: 'BUSY' };

    active = { phase: 'pending', type, requestId: command.requestId };

    try { onCommand(clone(command)); }
    catch { /* A UI observer must not invalidate a game operation. */ }

    try { response = await timed(signal => transport.execute(command, { signal })); }
    catch (err) { return fail(err?.code === 'TIMEOUT' ? 'TIMEOUT' : 'NETWORK_ERROR', {}, true); }

    snapshot = clone(response.snapshot);
    active = null;
    error = null;
    reconciliationRequired = false;
    publish();
    return { ok: true, revision };
  };

}

/**
 * Deterministic standalone-demo transport. All authority here is fake and local.
 * Do not ship in a real game client and do not treat combat.mock.* as an API.
 */
function createMockGameTransport({ initial = initialState(), delayMs = 120 } = {}) {
  let snapshot = clone(initial);
  let revision = 0;
  let failNext = false;
  const delay = (signal) => new Promise((resolve, reject) => {
    if (signal?.aborted) { reject(Object.assign(new Error('aborted'), { name: 'AbortError' })); return; }
    const onAbort = () => { clearTimeout(timer); reject(Object.assign(new Error('aborted'), { name: 'AbortError' })); };
    const timer = setTimeout(() => { signal?.removeEventListener('abort', onAbort); resolve(); }, delayMs);
    signal?.addEventListener('abort', onAbort, { once: true });
  });
  return {
    failNextRequest() { failNext = true; },
    async read({ signal } = {}) { await delay(signal); return { revision, snapshot: clone(snapshot) }; },
    async execute(command, { signal } = {}) {
      await delay(signal);
      if (failNext) { failNext = false; throw new Error('MOCK_NETWORK_UNAVAILABLE'); }
      if (command.version !== CONTRACT_VERSION) return { requestId:command.requestId, ok:false, code:'UNSUPPORTED_VERSION' };
      if (command.expectedRevision !== revision) return { requestId:command.requestId, ok:false, code:'REVISION_CONFLICT' };
      let outcome = null;
      let meta = {};
      const { type, payload } = command;
      if (type === 'crafting.create.requested') {
        outcome = craft(snapshot, payload.recipeId);
        if (outcome.ok) meta = { item: clone(outcome.item) };
      } else if (type === 'equipment.equip.requested') {
        outcome = equip(snapshot, payload.instanceId);
      } else if (type === 'expedition.start.requested') {
        const stage = stages.find(s => s.id === payload.stageId);
        outcome = stage && stageAccess(stage,snapshot).canEnter
          ? {ok:true,state:snapshot} : {ok:false, code:'STAGE_NOT_ACCESSIBLE'};
      } else if (type === 'expedition.abandon.requested') {
        outcome = { ok:true, state:snapshot };
      } else if (type === 'combat.mock.potion') {
        outcome = snapshot.potions > 0
          ? {ok:true,state:{...snapshot,potions:snapshot.potions-1}} : {ok:false,code:'NO_POTIONS'};
      } else if (type === 'expedition.complete.mock') {
        outcome = completeStage(snapshot,payload.stageId,payload.rewardQuantity);
        if (outcome.ok) meta = { reward:clone(outcome.reward) };
      } else return { requestId:command.requestId, ok:false, code:'UNSUPPORTED_COMMAND' };
      if (!outcome.ok) return { requestId:command.requestId, ok:false, code:outcome.code };
      snapshot = clone(outcome.state);
      revision += 1;
      return { requestId:command.requestId,ok:true,revision,snapshot:clone(snapshot),meta };
    },
    /** Test/demo-only: reset resets local fixture, increasing revision. */
    resetDemo() { snapshot = clone(initial); revision += 1; failNext = false; },
    /** Test/demo-only: emulate an external update for revision-conflict QA. */
    bumpDemoRevision() { revision += 1; },
    inspectDemo() { return { revision, snapshot:clone(snapshot) }; },
  };
}

async function battleAction(action) {
  if (!battle || isBusy()) return;
  const s = getStage(battle.stageId);
  const nextBattle = { ...battle };
  let log;
  if (action==='attack') { nextBattle.enemyHp=Math.max(0,nextBattle.enemyHp-35); nextBattle.energy=Math.min(100,nextBattle.energy+15); log='기본 공격 적중! 피해 35.'; }
  else if (action==='skill') { if (nextBattle.energy < 30) return; nextBattle.enemyHp=Math.max(0,nextBattle.enemyHp-62); nextBattle.energy-=30; log='전투 기술 적중! 피해 62.'; }
  else if (action==='potion') {
    if (state.potions <= 0) return;
    if (nextBattle.playerHp===state.player.maxHp) return notify('체력이 이미 가득 찼습니다.');
    if (!await submitCommand('combat.mock.potion',{})) return;
    nextBattle.playerHp=Math.min(state.player.maxHp,nextBattle.playerHp+45);
    log='회복 물약 사용! 체력 +45.';
  }
  else return;
  emit('combat.mock.action', { stageId:s.id, action, round:nextBattle.round+1 });
  nextBattle.round+=1;
  if (nextBattle.enemyHp===0) {
    // Deterministic demo ONLY. The real client must receive authoritative combat results.
    const completed=await submitCommand('expedition.complete.mock',{stageId:s.id,rewardQuantity:4});
    if (!completed) return;
    const rewards=completed.meta.reward;
    emit('expedition.result.mocked', { stageId:s.id, outcome:'victory', rewards });
    result = { stageId:s.id, victory:true, rewards };
    battle=null; screen='result'; render(); return;
  }
  nextBattle.playerHp=Math.max(0,nextBattle.playerHp-s.enemyDamage);
  nextBattle.log=`${log} 적의 반격으로 체력 ${s.enemyDamage} 감소.`;
  if (nextBattle.playerHp===0) {
    emit('expedition.result.mocked', { stageId:s.id, outcome:'defeat', rewards:{} });
    result={ stageId:s.id,victory:false,rewards:{} }; battle=null;screen='result';render();return;
  }
  battle=nextBattle; render();
}

let modalTrigger = null;
function openModal(type) {
  modalTrigger = { action: document.activeElement?.dataset?.action, id: document.activeElement?.dataset?.id, kind: document.activeElement?.classList.contains('mobile-settings') ? 'mobile-settings' : 'normal' };
  modal=type;render();requestAnimationFrame(()=>document.querySelector('.modal .close')?.focus());
}
function closeModal() {
  const trigger=modalTrigger;modal=null;render();
  requestAnimationFrame(()=>{
    const candidate=[...app.querySelectorAll('[data-action]')].find(el=>el.dataset.action===trigger?.action && el.dataset.id===trigger?.id && (trigger?.kind==='mobile-settings')===el.classList.contains('mobile-settings') && el.getClientRects().length>0);
    candidate?.focus({preventScroll:true});
  });
}
function render() {
  const current = document.activeElement;
  const focusKey = { action: current?.dataset?.action, id: current?.dataset?.id };
  const content=screen==='home'?homePage():screen==='expeditions'?expeditionsPage():screen==='forge'?forgePage():screen==='inventory'?inventoryPage():screen==='battle'?battlePage():resultPage();
  app.innerHTML=shell(content);
  if (focusKey.action && !modal) requestAnimationFrame(()=>{
    const candidate=[...app.querySelectorAll('[data-action]')].find(el=>!el.disabled && el.dataset.action===focusKey.action && el.dataset.id===focusKey.id);
    if(candidate) candidate.focus({preventScroll:true});
    else { const h1=app.querySelector('main h1'); if(h1){ h1.tabIndex=-1; h1.focus({preventScroll:true}); } }
  });
}

    case 'close-modal':closeModal();return;
    case 'select-stage':selectedStageId=id;emit('expedition.preview.opened',{stageId:id});render();return;
    case 'select-recipe':selectedRecipeId=id;emit('crafting.preview.opened',{recipeId:id});render();return;
    case 'start-stage':startStage(id);return;
    case 'craft': {
      const outcome=await submitCommand('crafting.create.requested',{recipeId:id});
      if (!outcome) return;
      emit('crafting.create.mocked',{recipeId:id,instanceId:outcome.meta.item?.instanceId});
      notify(`${outcome.meta.item?.name ?? '장비'} 제작 완료! 보관함에서 장착할 수 있습니다.`);
      render(); return;
    }
    case 'equip': {
      const outcome=await submitCommand('equipment.equip.requested',{instanceId:id});
      if (!outcome) return;
      emit('equipment.equip.mocked',{instanceId:id,totalPower:totalPower(state)});
      notify('장비를 장착했습니다. 현재 전투력이 반영되었습니다.');
      render(); return;
    }
    case 'battle-attack':battleAction('attack');return;
    case 'battle-skill':battleAction('skill');return;
    case 'battle-potion':battleAction('potion');return;
    case 'retreat':openModal('retreat');return;
    case 'confirm-retreat': {
      if (!await submitCommand('expedition.abandon.requested',{stageId:battle?.stageId})) return;
      battle=null;result=null;modal=null;screen='expeditions';notify('원정을 중단했습니다.');render();return;
    }
    case 'demo-fail-next': {
      mockTransport.failNextRequest(); closeModal();
      notify('다음 게임 조작에서 통신 오류를 재현합니다.');render();return;
    }
    case 'sync': {
      const outcome=await bridge.refresh();
      notify(outcome.ok?'최신 상태를 불러왔습니다.':operationError(outcome.code));
      render();return;
    }
    case 'reset': {
      if (isBusy()) return;
      mockTransport.resetDemo();
      selectedStageId='S02';selectedRecipeId='R01';battle=null;result=null;modal=null;screen='home';
      const outcome=await bridge.refresh();
      emit('prototype.reset',{});
      notify(outcome.ok?'시연 데이터가 초기화되었습니다.':operationError(outcome.code));render();return;
    }
  }
}
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(el && !el.disabled){handleAction(el.dataset.action,el.dataset.id);return;}
  if(e.target.matches('[data-backdrop]'))closeModal();
});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modal){e.preventDefault();closeModal();}
  if(e.key==='Tab'&&modal){
    const focusables=[...document.querySelectorAll('.modal button:not(:disabled)')];
    if(!focusables.length)return;
    if(e.shiftKey&&document.activeElement===focusables[0]){e.preventDefault();focusables.at(-1).focus();}
    else if(!e.shiftKey&&document.activeElement===focusables.at(-1)){e.preventDefault();focusables[0].focus();}
  }
});
// Inspection-only test surface; no gameplay authority.
window.__UI5_PROTOTYPE__={snapshot:()=>structuredClone({state,screen,selectedStageId,selectedRecipeId,battle,result,commands,bridgeStatus}),reset:()=>handleAction('reset'),demo:{failNext:()=>mockTransport.failNextRequest(),bumpRevision:()=>mockTransport.bumpDemoRevision(),read:()=>mockTransport.inspectDemo()}};
render();

</script>
